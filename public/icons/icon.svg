<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Halo glow -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" opacity="0.15"/>

  <!-- Open Bible Pages -->
  <!-- Left Page -->
  <path d="M 256 360 C 210 340 140 340 96 355 L 96 175 C 140 160 210 160 256 180 Z" fill="url(#pageGrad)"/>
  <!-- Right Page -->
  <path d="M 256 360 C 302 340 372 340 416 355 L 416 175 C 372 160 302 160 256 180 Z" fill="url(#pageGrad)"/>

  <!-- Page Lines Left -->
  <line x1="130" y1="205" x2="225" y2="205" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="235" x2="225" y2="235" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="265" x2="225" y2="265" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="295" x2="200" y2="295" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Page Lines Right -->
  <line x1="287" y1="205" x2="382" y2="205" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="287" y1="235" x2="382" y2="235" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="287" y1="265" x2="382" y2="265" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="287" y1="295" x2="357" y2="295" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Spine / Center Shadow -->
  <path d="M 253 180 L 253 360 L 259 360 L 259 180 Z" fill="#cbd5e1" opacity="0.8"/>

  <!-- Gold Bookmark Ribbon -->
  <path d="M 252 160 L 252 385 L 260 375 L 268 385 L 268 160 Z" fill="url(#goldGrad)"/>

  <!-- Star / Cross Sparkle Above -->
  <path d="M 256 95 L 261 123 L 289 128 L 261 133 L 256 161 L 251 133 L 223 128 L 251 123 Z" fill="url(#goldGrad)"/>

  <!-- Text "KOINONÍA" below -->
  <text x="256" y="440" font-family="'Times New Roman', serif" font-size="34" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="4">KOINONÍA</text>
</svg>
